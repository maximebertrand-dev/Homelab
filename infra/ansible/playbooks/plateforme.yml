# Plateforme applicative : une VM par zone (voir docs/adr/0010 et 0011).
# L'inventaire et les secrets (chiffrés par SOPS) sont tenus dans le dépôt privé :
#   ansible-playbook -i <inventaire> playbooks/plateforme.yml [-e secrets_source=coffre]

- name: Charger les secrets (SOPS ou coffre OpenBao, selon secrets_source)
  hosts: plateforme
  gather_facts: false
  roles:
    - secrets

- name: Socle commun (durcissement, mises à jour, Docker, agent de supervision, mise à jour du parc)
  hosts: plateforme
  become: true
  roles:
    - common
    - role: docker
      when: docker_active | default(true)
    # Carte graphique confiée à la VM (passage PCI) : pilote, conteneurs (CDI), relevé.
    - role: gpu_nvidia
      when: gpu_nvidia_actif | default(false)
    - agent_supervision
    - mise_a_jour

- name: Identité (LLDAP, Authelia)
  hosts: auth01
  become: true
  roles:
    - identite

- name: Coffre à secrets (OpenBao)
  hosts: vault01
  become: true
  roles:
    - montages
    - coffre

- name: WAF (BunkerWeb)
  hosts: waf01
  become: true
  roles:
    - waf

- name: Applications personnelles
  hosts: apps01
  become: true
  roles:
    - montages
    - immich
    - nextcloud

- name: Outils internes (proxy, NetBox, Semaphore)
  hosts: svc01
  become: true
  roles:
    - proxy
    - netbox
    - semaphore

- name: Supervision (Prometheus, Alertmanager, Grafana, ntfy)
  hosts: mon01
  become: true
  roles:
    - supervision

- name: Documentation
  hosts: web01
  become: true
  roles:
    - web
