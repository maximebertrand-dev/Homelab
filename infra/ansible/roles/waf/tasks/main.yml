- name: Créer le dossier de la pile WAF
  ansible.builtin.file:
    path: "{{ waf_dossier }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Créer le dossier des pages d'erreur
  ansible.builtin.file:
    path: "{{ waf_dossier }}/erreurs"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Générer les pages d'erreur personnalisées
  ansible.builtin.template:
    src: erreur.html.j2
    dest: "{{ waf_dossier }}/erreurs/{{ code }}.html"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ waf_erreurs.keys() | list }}"
  loop_control:
    loop_var: code

- name: Déposer les fichiers de la charte (habillage du portail d'authentification)
  ansible.builtin.copy:
    src: charte/
    dest: "{{ waf_dossier }}/charte/"
    owner: root
    group: root
    mode: "u=rwX,go=rX"

- name: Déposer les réglages CrowdSec (listes blanches, adresse de la maison, envois de plus de 10 Mo)
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ waf_dossier }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [crowdsec-liste-blanche.yaml, crowdsec-maison.yaml, crowdsec-appsec-corps.yaml, crowdsec-appsec.yaml]

- name: Vérifier que les chemins d'envoi ne concernent que des sites sans SSO
  ansible.builtin.assert:
    that: item.value.envois is not defined or item.value.sso is not defined
    fail_msg: "{{ item.key }} : les chemins d'envoi (envois) contourneraient la barrière SSO"
    quiet: true
  loop: "{{ waf_sites | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Créer le dossier des inclusions nginx
  ansible.builtin.file:
    path: "{{ waf_dossier }}/nginx"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Déposer l'inclusion des emplacements d'envoi (pas d'AppSec)
  ansible.builtin.copy:
    dest: "{{ waf_dossier }}/nginx/{{ waf_conf_sans_appsec | basename }}"
    content: |
      # Géré par Ansible (rôle waf).
      # Inclus dans les emplacements d'envoi de fichiers : le module CrowdSec de BunkerWeb (bouncer.lua) n'appelle pas
      # AppSec quand $no_appsec vaut 1 ; sinon il chargerait tout le corps de la requête en mémoire pour le transmettre.
      set $no_appsec 1;
    owner: root
    group: root
    mode: "0644"

- name: Déposer le fichier Compose de BunkerWeb
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ waf_dossier }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  register: waf_compose

- name: Démarrer BunkerWeb
  community.docker.docker_compose_v2:
    project_src: "{{ waf_dossier }}"
    state: present
    pull: missing
    recreate: "{{ 'always' if waf_compose.changed else 'auto' }}"

# --- Listes blanches CrowdSec ---------------------------------------------------------------------
# Pas de montage : Docker créerait /etc/crowdsec/parsers en root, et CrowdSec (non privilégié) ne pourrait plus y
# installer ses composants au démarrage (constaté le 27/09 : CrowdSec arrêté, WebSocket refusés). Les fichiers sont
# copiés une fois CrowdSec prêt, et recopiés par une minuterie après chaque recréation du conteneur (constaté le
# 29/09 : listes perdues à chaque recréation).

- name: Déposer le script de mise en place des listes blanches
  ansible.builtin.template:
    src: crowdsec-listes-blanches.sh.j2
    dest: /usr/local/sbin/crowdsec-listes-blanches
    owner: root
    group: root
    mode: "0750"

- name: Déclarer le service et la minuterie des listes blanches
  ansible.builtin.copy:
    dest: "/etc/systemd/system/crowdsec-listes-blanches.{{ item.extension }}"
    content: "{{ item.contenu }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - extension: service
      contenu: |
        # Géré par Ansible (rôle waf)
        [Unit]
        Description=Listes blanches CrowdSec du homelab dans le conteneur du WAF
        After=docker.service
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/crowdsec-listes-blanches
    - extension: timer
      contenu: |
        # Géré par Ansible (rôle waf)
        [Unit]
        Description=Remettre les listes blanches CrowdSec après une recréation du WAF
        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=2min
        AccuracySec=10s
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "crowdsec-listes-blanches.{{ item.extension }}"
  register: waf_listes_unites

- name: Activer la minuterie des listes blanches
  ansible.builtin.systemd_service:
    name: crowdsec-listes-blanches.timer
    state: started
    enabled: true
    daemon_reload: "{{ waf_listes_unites is changed }}"

- name: Déposer le nettoyage des envois abandonnés
  ansible.builtin.template:
    src: waf-nettoyage-envois.sh.j2
    dest: /usr/local/sbin/waf-nettoyage-envois
    owner: root
    group: root
    mode: "0750"

- name: Déclarer le service et la minuterie du nettoyage des envois
  ansible.builtin.copy:
    dest: "/etc/systemd/system/waf-nettoyage-envois.{{ item.extension }}"
    content: "{{ item.contenu }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - extension: service
      contenu: |
        # Géré par Ansible (rôle waf)
        [Unit]
        Description=Supprimer les fichiers d'envoi abandonnés dans le conteneur du WAF
        After=docker.service
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/waf-nettoyage-envois
    - extension: timer
      contenu: |
        # Géré par Ansible (rôle waf)
        [Unit]
        Description=Nettoyer les fichiers d'envoi abandonnés du WAF toutes les heures
        [Timer]
        OnBootSec=15min
        OnUnitActiveSec=1h
        [Install]
        WantedBy=timers.target
  loop_control:
    label: "waf-nettoyage-envois.{{ item.extension }}"
  register: waf_nettoyage_unites

- name: Activer la minuterie du nettoyage des envois
  ansible.builtin.systemd_service:
    name: waf-nettoyage-envois.timer
    state: started
    enabled: true
    daemon_reload: "{{ waf_nettoyage_unites is changed }}"
  # À blanc (--check), l'unité n'est pas encore déposée : pas d'erreur pour autant.
  ignore_errors: "{{ ansible_check_mode }}"

- name: Attendre que CrowdSec ait installé ses composants
  ansible.builtin.command: >-
    docker exec waf-bunkerweb-1 sh -c
    'test -d /etc/crowdsec/postoverflows/s01-whitelist && test -d /etc/crowdsec/appsec-configs'
  register: waf_crowdsec_pret
  until: waf_crowdsec_pret.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: Installer les listes blanches dans CrowdSec
  ansible.builtin.command: /usr/local/sbin/crowdsec-listes-blanches
  register: waf_listes_installees
  changed_when: "'installée' in waf_listes_installees.stdout"

- name: Appliquer le rechargement de CrowdSec avant la vérification
  ansible.builtin.meta: flush_handlers

- name: Vérifier que l'API locale de CrowdSec répond
  ansible.builtin.command: docker exec waf-bunkerweb-1 cscli lapi status
  register: waf_crowdsec_lapi
  until: waf_crowdsec_lapi.rc == 0
  # Conteneur recréé : CrowdSec retélécharge ses règles avant d'ouvrir son API (plusieurs minutes).
  retries: 60
  delay: 5
  changed_when: false
