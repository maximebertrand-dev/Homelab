waf_dossier: /opt/piles/waf
waf_image: bunkerity/bunkerweb-all-in-one:1.6.17
# Pays autorisés (codes ISO ou groupes BunkerWeb comme @EU) : tout le reste est refusé.
waf_pays_autorises: "FR"
# Codes HTTP comptés comme « comportement suspect » (10 en 60 s = bannissement). 429 (limite de débit) n'en fait
# pas partie : la limite freine déjà, et une rafale légitime d'application ne doit pas valoir un bannissement.
waf_codes_suspects: "400 403 405 444"
# Durée du bannissement (secondes) : un faux positif se résorbe seul, les scanners étrangers restent bloqués par pays.
waf_duree_bannissement: 3600
# Liste blanche CrowdSec : chemins où le trafic normal d'une application ressemble à un robot (nombreuses URL
# distinctes : vignettes, synchronisation, fichiers de langue). Ces requêtes passent toujours par ModSecurity,
# la limite de débit et l'authentification ; seule l'analyse comportementale de CrowdSec les ignore.
#   - { site: photos, chemins: ["/api/assets/"] }
waf_crowdsec_liste_blanche: []
# Adresses jamais bannies par CrowdSec (ADR 0021) : adresse par laquelle sort toute la maison. Ses requêtes restent
# filtrées une à une par ModSecurity et AppSec.
waf_crowdsec_adresses_maison: []
# Requêtes de plus de 10 Mo vues par CrowdSec AppSec : drop (rejet sans inspection, défaut de CrowdSec), partial
# (10 premiers Mo inspectés, le reste passe) ou allow (corps non inspecté).
waf_crowdsec_appsec_corps: partial
# Fichier inclus dans les emplacements d'envoi (site.envois) : le module CrowdSec de BunkerWeb n'y appelle pas AppSec.
waf_conf_sans_appsec: /etc/homelab-waf/sans-appsec.conf
# Sites publiés : nom (sous-domaine public) => cible et réglages propres.
waf_sites: {}
#  photos:
#    cible: http://apps01.example:2283
#    taille_max: 50G
#    envois: ["= /api/assets"]            # chemins réservés aux envois de fichiers : corps transmis sans ModSecurity
#                                         # ni AppSec (qui le chargeraient en mémoire) ; sites sans SSO uniquement
#    websocket: true
#    greffons_crs: ""
#    methodes: "GET|POST|HEAD"            # méthodes HTTP autorisées (BunkerWeb : GET|POST|HEAD par défaut)
#    exclusions_modsec: []                # règles SecRule ajoutées avant le CRS (faux positifs)
#    charte: portail.css                  # feuille de style de files/charte/ injectée dans les pages (habillage)
#    sso:                                 # connexion obligatoire par Authelia (auth_request)
#      portail: https://auth.example
#      verification: http://auth01.example:9091/api/authz/auth-request
#      sans_sso: ["/rest/"]               # chemins exemptés (l'application s'authentifie elle-même), identité effacée

# Pages d'erreur personnalisées (générées depuis templates/erreur.html.j2) : code => textes.
waf_erreurs:
  400:
    titre: "Requête invalide"
    texte: "Le serveur n'a pas compris la requête envoyée par votre navigateur ou votre application."
    conseil: "Rechargez la page ; si le problème persiste, videz le cache du navigateur."
  401:
    titre: "Authentification requise"
    texte: "Cette ressource demande d'être connecté."
    conseil: "Connectez-vous depuis l'accueil du service, puis réessayez."
  403:
    titre: "Accès refusé"
    texte: >-
      Le pare-feu applicatif a bloqué cette requête : elle ressemble à une attaque, vient d'un pays non autorisé, ou
      votre adresse a été temporairement bannie après trop d'erreurs.
    conseil: "Si vous êtes un utilisateur légitime, attendez quelques minutes puis réessayez, et prévenez l'administrateur si le blocage continue."
    couleur: "#f87171"
  404:
    titre: "Page introuvable"
    texte: "Cette adresse n'existe pas, ou plus."
    conseil: "Vérifiez l'adresse, ou revenez à l'accueil du service."
  405:
    titre: "Méthode non autorisée"
    texte: "Ce type de requête n'est pas accepté par ce service."
    conseil: "Utilisez l'application ou le site officiel du service."
  413:
    titre: "Fichier trop volumineux"
    texte: "L'envoi dépasse la taille maximale autorisée pour ce service."
    conseil: "Réduisez la taille du fichier, ou utilisez l'application de synchronisation, qui découpe les gros envois."
    couleur: "#f59e0b"
  429:
    titre: "Trop de requêtes"
    texte: "Vous avez envoyé beaucoup de requêtes en peu de temps : le pare-feu ralentit le rythme pour protéger le service."
    conseil: "Patientez une minute avant de réessayer."
    couleur: "#f59e0b"
  500:
    titre: "Erreur interne"
    texte: "Le service a rencontré un problème en traitant votre demande."
    conseil: "Réessayez dans quelques instants ; l'incident est enregistré dans la supervision."
    couleur: "#f87171"
  502:
    titre: "Service injoignable"
    texte: "Le pare-feu applicatif n'a pas pu joindre le service : il redémarre ou est en panne."
    conseil: "Réessayez dans quelques minutes ; la supervision a prévenu l'administrateur."
    couleur: "#f87171"
  503:
    titre: "Service indisponible"
    texte: "Le service est momentanément indisponible, probablement pour une maintenance."
    conseil: "Réessayez un peu plus tard."
    couleur: "#f59e0b"
  504:
    titre: "Délai dépassé"
    texte: "Le service a mis trop de temps à répondre."
    conseil: "Réessayez ; si l'opération était longue (gros envoi), elle a peut-être abouti malgré tout."
    couleur: "#f59e0b"

# Nettoyage horaire des fichiers temporaires d'envoi abandonnés (processus nginx tué en plein envoi) : âge minimal.
waf_nettoyage_envois_minutes: 120
