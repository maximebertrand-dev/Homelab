proxy_dossier: /opt/piles/proxy
proxy_image: traefik:v3.7.16
proxy_email_acme: "admin@{{ domaine_public }}"
# Seuls les postes du VPN d'administration passent (défense en profondeur : OPNsense filtre déjà).
proxy_sources_autorisees: []
# Services internes publiés : nom (sous-domaine de la zone interne) => URL de la cible, ou
# { url: …, sso: true } pour imposer en plus la connexion SSO (Authelia, règles d'accès du rôle identite).
proxy_services: {}
# Point de vérification d'Authelia pour les services « sso » (forward-auth) ; vide = aucun service ne peut l'exiger.
proxy_sso_verification: ""
# Jeton Cloudflare (DNS Edit sur la zone publique) pour le certificat wildcard ; vide = certificat par défaut de Traefik.
proxy_jeton_dns: "{{ cloudflare_dns_token | default('') }}"
