- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_paquets + common_paquets_supplementaires }}"
    state: present

- name: Installer l'agent QEMU (VM uniquement)
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  when: ansible_virtualization_role == "guest"

- name: Démarrer l'agent QEMU
  ansible.builtin.service:
    name: qemu-guest-agent
    state: started
    enabled: true
  when: ansible_virtualization_role == "guest"

- name: Définir le fuseau horaire
  community.general.timezone:
    name: "{{ common_fuseau }}"

- name: Créer les dossiers de configuration systemd
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/systemd/timesyncd.conf.d
    - /etc/systemd/journald.conf.d
    - /etc/systemd/resolved.conf.d

- name: Synchroniser l'heure sur le pare-feu de la zone
  ansible.builtin.copy:
    dest: /etc/systemd/timesyncd.conf.d/homelab.conf
    content: |
      # Géré par Ansible (rôle common)
      [Time]
      NTP={{ common_ntp }}
    mode: "0644"
  when: common_ntp | length > 0 and ansible_virtualization_role == "guest"
  notify: Redémarrer timesyncd

- name: Appliquer automatiquement les correctifs de sécurité
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52homelab-unattended
    content: |
      // Géré par Ansible (rôle common) : correctifs de sécurité Debian uniquement, sans redémarrage automatique.
      Unattended-Upgrade::Origins-Pattern {
        "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"

- name: Activer les mises à jour automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Durcir le serveur SSH (clé uniquement)
  ansible.builtin.template:
    src: sshd-durcissement.conf.j2
    dest: /etc/ssh/sshd_config.d/10-durcissement.conf
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Recharger SSH

- name: Savoir si systemd-resolved est en service
  ansible.builtin.stat:
    path: /run/systemd/resolve/stub-resolv.conf
  register: common_resolved

- name: Couper la résolution de noms par diffusion (LLMNR, mDNS)
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/homelab.conf
    content: |
      # Géré par Ansible (rôle common) : noms résolus par le DNS du pare-feu seulement ; LLMNR et mDNS se laissent
      # usurper par n'importe quelle machine du même réseau.
      [Resolve]
      LLMNR={{ 'yes' if common_resolution_diffusion else 'no' }}
      MulticastDNS={{ 'yes' if common_resolution_diffusion else 'no' }}
    mode: "0644"
  when: common_resolved.stat.exists
  notify: Redémarrer resolved

- name: Journal d'audit des fichiers sensibles (ADR 0021)
  when: common_audit | bool
  block:
    - name: Installer auditd et son greffon syslog
      ansible.builtin.apt:
        name: [auditd, audispd-plugins]
        state: present

    - name: Déposer les règles d'audit
      ansible.builtin.template:
        src: audit-homelab.rules.j2
        dest: /etc/audit/rules.d/homelab.rules
        owner: root
        group: root
        mode: "0640"
      notify: Charger les règles d'audit

    - name: Envoyer les événements d'audit au journal système (greffon syslog)
      ansible.builtin.lineinfile:
        path: /etc/audit/plugins.d/syslog.conf
        regexp: '^active\s*='
        line: "active = yes"
      notify: Redémarrer auditd

    - name: Démarrer auditd
      ansible.builtin.service:
        name: auditd
        state: started
        enabled: true

- name: Associer le nom de la machine à son adresse réelle (modèle de /etc/hosts de cloud-init)
  ansible.builtin.template:
    src: hosts.debian.tmpl.j2
    dest: /etc/cloud/templates/hosts.debian.tmpl
    owner: root
    group: root
    mode: "0644"
  when: adresse_ipv4 is defined

- name: Corriger /etc/hosts sans attendre le prochain démarrage
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^(127\.0\.1\.1|{{ adresse_ipv4 | default("") | regex_escape }})\s'
    line: "{{ adresse_ipv4 }} {{ inventory_hostname }}.{{ domaine_interne }} {{ inventory_hostname }}"
  when: adresse_ipv4 is defined

- name: Autoriser les clés SSH supplémentaires (limitées à leur adresse source, sans redirection)
  ansible.posix.authorized_key:
    user: "{{ ansible_user }}"
    key: "{{ item.cle }}"
    key_options: 'from="{{ item.depuis }}",restrict,pty'
    state: present
  loop: "{{ common_cles_autorisees }}"
  loop_control:
    label: "{{ item.cle.split()[-1] }} depuis {{ item.depuis }}"

- name: Limiter la taille des journaux système
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/homelab.conf
    content: |
      # Géré par Ansible (rôle common)
      [Journal]
      Storage=persistent
      SystemMaxUse=500M
    mode: "0644"
  notify: Redémarrer journald
