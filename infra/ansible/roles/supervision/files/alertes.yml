# Règles d'alerte. Niveau « critique » : e-mail + notification sur téléphone ; « avertissement » : NOC uniquement.
# D'autres règles peuvent venir d'ailleurs (supervision_regles_supplementaires), ex. en gravité « admin ».
groups:
  - name: disponibilite
    rules:
      - alert: MachineInjoignable
        expr: up{job="machines"} == 0
        for: 3m
        labels: { severite: critique }
        annotations:
          resume: "{{ $labels.instance }} ne répond plus"
          description: "La supervision n'arrive plus à joindre {{ $labels.instance }} depuis 3 minutes (machine arrêtée, réseau ou agent en panne)."
      - alert: VMArretee
        expr: pve_up{id=~"qemu/.*"} == 0 and on (id) pve_onboot_status == 1
        for: 5m
        labels: { severite: critique }
        annotations:
          resume: "La VM {{ $labels.id }} est arrêtée"
          description: "Une VM censée démarrer avec l'hyperviseur est arrêtée depuis 5 minutes."
      - alert: ServicePublicIndisponible
        expr: probe_success{job="services"} == 0
        for: 3m
        labels: { severite: critique }
        annotations:
          resume: "{{ $labels.instance }} est indisponible"
          description: "La sonde HTTPS de {{ $labels.instance }} échoue depuis 3 minutes (application, WAF ou certificat)."
      - alert: OutilInterneIndisponible
        expr: probe_success{job="outils-internes"} == 0
        for: 10m
        labels: { severite: avertissement }
        annotations:
          resume: "{{ $labels.instance }} est indisponible"
          description: "Un outil interne ne répond plus depuis 10 minutes."

  - name: stockage
    rules:
      - alert: PoolZFSDegrade
        expr: node_zfs_zpool_state{state!="online"} > 0
        for: 1m
        labels: { severite: critique }
        annotations:
          resume: "Pool ZFS {{ $labels.zpool }} : {{ $labels.state }}"
          description: "Le pool {{ $labels.zpool }} n'est plus en état ONLINE : un disque est probablement en panne. Vérifier avec « zpool status »."
      - alert: DisqueEnEchecSMART
        expr: smartctl_device_smart_status == 0
        for: 5m
        labels: { severite: critique }
        annotations:
          resume: "Disque {{ $labels.device }} en échec SMART"
          description: "Le disque {{ $labels.device }} signale une défaillance : préparer son remplacement."
      - alert: DefautsDisqueEnHausse
        expr: increase(smartctl_scsi_grown_defect_list[24h]) > 0
        labels: { severite: avertissement }
        annotations:
          resume: "Nouveaux secteurs défectueux sur {{ $labels.device }}"
          description: "La liste des défauts du disque {{ $labels.device }} a augmenté sur 24 h : surveiller son évolution."
      - alert: EspaceDisqueFaible
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|virtiofs|nullfs"} / node_filesystem_size_bytes) > 0.85
        for: 15m
        labels: { severite: avertissement }
        annotations:
          resume: "{{ $labels.instance }} : {{ $labels.mountpoint }} rempli à plus de 85 %"
          description: "Espace disque bientôt épuisé sur {{ $labels.instance }} ({{ $labels.mountpoint }})."
      - alert: EspaceDisqueCritique
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|ramfs|virtiofs|nullfs"} / node_filesystem_size_bytes) > 0.95
        for: 5m
        labels: { severite: critique }
        annotations:
          resume: "{{ $labels.instance }} : {{ $labels.mountpoint }} presque plein"
          description: "Moins de 5 % d'espace libre : les services vont bientôt échouer."

  - name: sauvegardes
    rules:
      - alert: SauvegardeEchouee
        expr: homelab_sauvegarde_statut == 0
        labels: { severite: critique }
        annotations:
          resume: "La sauvegarde hors site a échoué"
          description: "Le dernier passage de la sauvegarde a échoué : journalctl -u sauvegarde-homelab sur l'hyperviseur."
      - alert: SauvegardeEnRetard
        expr: time() - homelab_sauvegarde_derniere_reussite_timestamp > 30 * 3600
        labels: { severite: critique }
        annotations:
          resume: "Aucune sauvegarde réussie depuis plus de 30 heures"
          description: "La dernière sauvegarde hors site réussie date de plus de 30 heures (minuterie arrêtée, stockage distant injoignable ?)."
      - alert: SauvegardeVerificationEchouee
        expr: homelab_sauvegarde_verification_statut == 0
        labels: { severite: critique }
        annotations:
          resume: "Sauvegarde non conforme : empreintes différentes ou dépôt abîmé"
          description: >-
            {{ $value }} : la copie relue chez l'hébergeur ne correspond pas à la source, ou le contrôle du dépôt restic a
            échoué. Ne pas se fier à cette sauvegarde : journalctl -u sauvegarde-homelab.
      - alert: SauvegardeVerificationEnRetard
        expr: time() - homelab_sauvegarde_verification_derniere_reussite_timestamp > 30 * 3600
        labels: { severite: critique }
        annotations:
          resume: "Aucune sauvegarde vérifiée depuis plus de 30 heures"
          description: "Les empreintes de la sauvegarde n'ont pas été contrôlées avec succès depuis plus de 30 heures."
      - alert: SauvegardeEspaceRempli
        expr: homelab_sauvegarde_espace_utilise_ratio > 0.8
        for: 1h
        labels: { severite: avertissement }
        annotations:
          resume: "Stockage des sauvegardes rempli à plus de 80 %"
          description: "Le stockage distant des sauvegardes est rempli à {{ $value | humanizePercentage }} : revoir la rétention ou le périmètre."

  - name: stockage_et_courriels
    rules:
      - alert: StockageDonneesPresquePlein
        expr: homelab_stockage_utilise_octets / (homelab_stockage_utilise_octets + homelab_stockage_disponible_octets) > 0.9
        for: 30m
        labels: { severite: avertissement }
        annotations:
          resume: "{{ $labels.jeu }} : stockage rempli à plus de 90 %"
          description: >-
            {{ $labels.jeu }} occupe {{ $value | humanizePercentage }} de la place permise (quota ou reste du pool) : faire de
            la place ou revoir le quota.
      - alert: StockagePoolPresquePlein
        expr: homelab_stockage_total_utilise_octets / (homelab_stockage_total_utilise_octets + homelab_stockage_total_disponible_octets) > 0.85
        for: 30m
        labels: { severite: avertissement }
        annotations:
          resume: "Pool {{ $labels.pool }} rempli à plus de 85 %"
          description: "Le pool occupe {{ $value | humanizePercentage }} de son espace utile ; au-delà de 80-90 %, ZFS ralentit."
      - alert: CourrielsEnEchec
        expr: increase(homelab_courriels{periode="total",etat="failed"}[1h]) > 0
        labels: { severite: avertissement }
        annotations:
          resume: "E-mails du homelab refusés par le relais"
          description: >-
            {{ $value | humanize }} e-mail(s) en échec chez Scaleway en une heure (adresse invalide, rejet) : console Scaleway,
            Transactional Email, activité.
      - alert: CourrielsQuotaMensuel
        expr: sum(homelab_courriels{periode="mois"}) > 270
        labels: { severite: info }
        annotations:
          resume: "Plus de 270 e-mails envoyés ce mois-ci"
          description: "{{ $value | humanize }} e-mails depuis le 1er du mois ; l'offre gratuite de Scaleway en couvre 300, la suite est facturée à l'usage."
      - alert: CourrielsReleveImpossible
        expr: homelab_courriels_releve_reussi == 0
        for: 1h
        labels: { severite: avertissement }
        annotations:
          resume: "Relevé des e-mails impossible"
          description: "L'API de Scaleway ne répond pas ou refuse la clé depuis une heure : journalctl -u releve-courriels sur mon01."
  - name: ressources
    rules:
      - alert: MemoireSaturee
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.92
        for: 10m
        labels: { severite: avertissement }
        annotations:
          resume: "{{ $labels.instance }} : mémoire saturée"
          description: "Plus de 92 % de la mémoire utilisée depuis 10 minutes."
      # Pics trop brefs pour MemoireSaturee : le noyau tue un processus puis la mémoire redescend (WAF, 28-30/09).
      - alert: ProcessusTuesFauteDeMemoire
        expr: increase(node_vmstat_oom_kill[15m]) > 0
        labels: { severite: avertissement }
        annotations:
          resume: "{{ $labels.instance }} : processus tué faute de mémoire"
          description: "{{ $value | humanize }} processus tué(s) par le noyau (OOM) en 15 minutes : voir journalctl -k."
      - alert: ProcesseurSature
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.9
        for: 15m
        labels: { severite: avertissement }
        annotations:
          resume: "{{ $labels.instance }} : processeur saturé"
          description: "Processeur occupé à plus de 90 % depuis 15 minutes."

  - name: certificats
    rules:
      - alert: CertificatBientotExpire
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        labels: { severite: avertissement }
        annotations:
          resume: "Certificat de {{ $labels.instance }} : expiration dans moins de 14 jours"
          description: "Le renouvellement automatique n'a pas eu lieu : vérifier Let's Encrypt."
      - alert: CertificatExpireImminent
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 5
        labels: { severite: critique }
        annotations:
          resume: "Certificat de {{ $labels.instance }} : expiration dans moins de 5 jours"
          description: "Les visiteurs verront bientôt une erreur de sécurité."

  - name: supervision
    rules:
      - alert: CibleDeCollecteInjoignable
        expr: up{job=~"disques|proxmox|supervision|veille"} == 0
        for: 10m
        labels: { severite: avertissement }
        annotations:
          resume: "Collecte {{ $labels.job }} en échec"
          description: "La supervision n'obtient plus les métriques de {{ $labels.job }} ({{ $labels.instance }})."
      - alert: JournauxNonRecus
        expr: sum(rate(vl_rows_ingested_total[30m])) == 0
        for: 30m
        labels: { severite: avertissement }
        annotations:
          resume: "Aucun journal reçu depuis 30 minutes"
          description: "VictoriaLogs ne reçoit plus rien : envoi des machines (systemd-journal-upload) ou entrée en panne."

  # Mises à jour et veille de sécurité. Gravité « veille » : e-mail + téléphone (rappel chaque semaine tant que ce
  # n'est pas fait, puis « résolu »), jamais de SMS ni d'affichage sur le NOC (visible par la famille).
  # Marche à suivre : docs/runbooks/mises-a-jour.md (annoncer, puis « Mettre à jour le parc » dans Semaphore).
  - name: mises_a_jour
    rules:
      - alert: VeilleActionSecurite
        expr: homelab_veille_action == 1
        labels: { severite: veille }
        annotations:
          resume: "{{ $labels.service }} ({{ $labels.machine }}) : {{ $labels.action }}"
          description: "{{ $labels.detail }}"
      - alert: PaquetsSecuriteEnAttente
        expr: homelab_apt_mises_a_jour{origine="securite"} > 0
        for: 30h
        labels: { severite: veille }
        annotations:
          resume: "{{ $labels.instance }} : {{ $value }} mise(s) à jour de sécurité en attente"
          description: "Les mises à jour automatiques ne les ont pas installées depuis plus d'un jour : lancer « Mettre à jour le parc »."
      - alert: PaquetsProxmoxEnAttente
        expr: homelab_apt_mises_a_jour{origine="proxmox"} > 0
        for: 3d
        labels: { severite: veille }
        annotations:
          resume: "{{ $labels.instance }} : {{ $value }} paquet(s) Proxmox en attente"
          description: "Paquets Proxmox jamais installés automatiquement : « Mettre à jour le parc » avec hyperviseur=oui."
      - alert: RedemarrageEnAttente
        expr: (homelab_redemarrage_requis == 1) or (homelab_noyau_a_jour == 0)
        for: 3d
        labels: { severite: veille }
        annotations:
          resume: "{{ $labels.instance }} attend un redémarrage depuis plus de 3 jours"
          description: "Un noyau ou une bibliothèque système mis à jour n'est pas encore en service : planifier une maintenance."
      - alert: MiseAJourEchouee
        expr: homelab_mise_a_jour_statut == 0
        labels: { severite: critique }
        annotations:
          resume: "{{ $labels.instance }} : la dernière mise à jour a échoué"
          description: "journalctl -u mise-a-jour sur la machine ; les services peuvent être dans un état intermédiaire."
      - alert: EtatMisesAJourPerime
        expr: time() - homelab_etat_mises_a_jour_timestamp > 3 * 3600
        labels: { severite: avertissement }
        annotations:
          resume: "{{ $labels.instance }} : état des mises à jour non relevé depuis 3 heures"
          description: "Minuterie etat-mises-a-jour arrêtée ou en échec : systemctl status etat-mises-a-jour."
      - alert: VeilleEnPanne
        expr: (time() - homelab_veille_derniere_reussite_timestamp > 36 * 3600) or absent(homelab_veille_derniere_reussite_timestamp)
        for: 3h
        labels: { severite: avertissement }
        annotations:
          resume: "Veille de sécurité sans résultat depuis plus de 36 heures"
          description: "docker logs supervision-veille-1 sur la VM de supervision (base de failles, registres, GitHub injoignables ?)."
      - alert: VeilleAnalyseImpossible
        expr: homelab_veille_analyse_ok == 0
        for: 2d
        labels: { severite: avertissement }
        annotations:
          resume: "{{ $labels.service }} : image non analysée depuis 2 jours"
          description: "Trivy n'arrive pas à lister les paquets de {{ $labels.image }}:{{ $labels.version }} (registre injoignable ?)."

  # Travaux d'import (rapatriement de données d'un nuage vers le homelab) : état et avancement publiés par la machine
  # qui les exécute (métriques homelab_import_* ; état 0 jamais lancé, 1 en cours, 2 terminé, 3 échec, 4 programmé,
  # 5 interrompu).
  - name: imports
    rules:
      - alert: ImportEchoue
        expr: homelab_import_etat == 3
        labels: { severite: veille }
        annotations:
          resume: "Import « {{ $labels.travail }} » en échec"
          description: >-
            Le travail s'est arrêté sur une erreur ({{ with query (printf "homelab_import_erreurs{travail='%s'}"
            $labels.travail) }}{{ . | first | value }}{{ end }} erreur(s) au total) : journalctl -u import-nuage-{{
            $labels.travail }}, puis le relancer (il reprend où il s'était arrêté).
      - alert: ImportInterrompu
        expr: homelab_import_etat == 5
        for: 10m
        labels: { severite: veille }
        annotations:
          resume: "Import « {{ $labels.travail }} » interrompu avant la fin"
          description: >-
            Arrêté sans reprise prévue (arrêt manuel ?) : le relancer avec import-nuage lancer {{ $labels.travail }} (il reprend
            où il s'était arrêté).
      - alert: ImportBloque
        expr: homelab_import_etat == 1 and delta(homelab_import_octets[2h]) == 0
        for: 30m
        labels: { severite: veille }
        annotations:
          resume: "Import « {{ $labels.travail }} » bloqué depuis 2 heures"
          description: >-
            Aucun octet copié depuis 2 heures alors que le travail tourne : jeton expiré, limite de l'API du fournisseur ?
            journalctl -u import-nuage-{{ $labels.travail }}.
      - alert: ImportTermine
        expr: homelab_import_etat == 2 and (time() - homelab_import_fin_timestamp) < 3600
        labels: { severite: info }
        annotations:
          resume: "Import « {{ $labels.travail }} » terminé"
          description: >-
            {{ with query (printf "homelab_import_octets{travail='%s'}" $labels.travail) }}{{ . | first | value | humanize1024
            }}o copiés{{ end }}.

  # Veille des connexions (conteneur « connexions ») : ses propres alertes partent directement à Alertmanager ;
  # celle-ci signale qu'elle ne tourne plus ou ne lit plus les journaux (sinon, plus aucune tentative ne serait vue).
  - name: connexions
    rules:
      - alert: VeilleConnexionsArretee
        expr: >-
          up{job="connexions"} == 0
          or (time() - homelab_connexions_derniere_execution_timestamp > 600)
          or homelab_connexions_lecture_ok == 0
        for: 15m
        labels: { severite: admin }
        annotations:
          resume: "Veille des connexions arrêtée ou aveugle"
          description: >-
            Le conteneur « connexions » de mon01 ne tourne plus ou ne lit plus VictoriaLogs depuis 15 minutes : les
            tentatives de connexion depuis une adresse inconnue ne sont plus signalées. docker logs supervision-connexions-1.
