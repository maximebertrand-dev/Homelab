supervision_dossier: /opt/piles/supervision
supervision_images:
  prometheus: prom/prometheus:v3.15.0
  alertmanager: prom/alertmanager:v0.34.1
  blackbox: prom/blackbox-exporter:v0.28.0
  pve: prompve/prometheus-pve-exporter:3.10.0
  grafana: grafana/grafana:13.2.2
  ntfy: binwiederhier/ntfy:v2.28.0
  noc_web: nginxinc/nginx-unprivileged:1.30.5-alpine-slim
  noc_collecte: python:3.14.7-alpine3.24
  sms: python:3.14.7-alpine3.24
  victorialogs: victoriametrics/victoria-logs:v1.52.0
  vmalert: victoriametrics/vmalert:v1.152.0
supervision_retention: 30d
# Journaux centralisés (ADR 0020) : VictoriaLogs, alimenté par systemd-journal-upload (VM, hyperviseur) et syslog
# (pare-feu). Les machines n'atteignent que l'entrée en écriture ; la lecture se fait par Grafana.
supervision_journaux: true
supervision_journaux_retention: 30d
supervision_journaux_espace_max: 10GiB
supervision_journaux_port: 9428
supervision_journaux_syslog_port: 5140
# Interface web de VictoriaLogs en lecture seule (/select/ uniquement), pour ces sources (le proxy interne, qui impose
# le SSO des administrateurs) ; vide = aucune lecture hors de Grafana.
supervision_journaux_lecture_sources: []
supervision_journaux_lecture_port: 9429
supervision_grafana_plugin_journaux: victoriametrics-logs-datasource@0.32.0
# SMS des alertes critiques par l'option gratuite « Notifications par SMS » de Free Mobile (au titulaire de la ligne
# seulement) : { utilisateur: identifiant Free Mobile, cle: clé de l'option }. Vide = pas de SMS.
supervision_sms_free: {}
# Machines sans inventaire Ansible mais supervisées (pare-feu : plugin node_exporter d'OPNsense).
supervision_machines_supplementaires: [fw01]
# Services publiés sondés depuis l'intérieur (via le WAF) et outils internes (via le proxy de svc01).
supervision_services_publics: []
# Services publiés derrière le SSO du WAF : réponse attendue = redirection vers le portail (module « sso »).
supervision_services_sso: []
# Adresse du portail SSO attendue dans la redirection (module « sso »).
supervision_portail_sso: "https://auth.{{ domaine_public }}/"
supervision_outils_internes: []
# Destinataire des alertes critiques (e-mail) et sujet ntfy (notifications sur téléphone).
supervision_email_alertes: ""
supervision_ntfy_sujet: homelab-alertes
supervision_noc_url: "https://noc.{{ domaine_public }}"
# Grafana : exploration détaillée des métriques, outil interne (VPN) derrière le proxy de svc01.
supervision_grafana_url: "https://grafana.{{ domaine_interne }}"
# NOC public (page sur mesure) : seule l'adresse du WAF peut le joindre, le WAF imposant la connexion SSO.
supervision_noc_sources: []
# Libellés affichés par le NOC : { services: { <nom d'hôte>: { nom, description, ordre } },
#   machines: { <machine>: { role, ordre } }, outils: { <nom d'hôte>: { nom } } }
supervision_noc_libelles: {}
# Groupe dont les membres voient les blocs réservés du NOC (transferts) ; libellés des travaux dans
# supervision_noc_libelles.transferts ({ <travail>: <nom affiché> }).
supervision_noc_groupe_admin: admins
supervision_ntfy_url: "https://ntfy.{{ domaine_public }}"
supervision_issuer: "https://auth.{{ domaine_public }}"
# Autorité interne (certificats des outils qui ne passent pas par Let's Encrypt, ex. le coffre OpenBao).
supervision_ca_interne: "{{ ca_interne.certificat | default('') }}"

# --- Veille de sécurité (files/veille/veille.py) --------------------------------------------------------------
# Chaque nuit : failles des images en service (Trivy), nouvelles constructions, dernières versions et avis de
# sécurité des projets (GitHub). Alertes « veille » (e-mail + téléphone) et tableau Grafana « Veille de sécurité ».
supervision_veille: true
supervision_veille_heure: "04:40"
# Trivy figé par empreinte (chaîne de publication compromise en mars 2026 : GHSA-69fq-xp46-6x23).
supervision_veille_trivy: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
supervision_veille_memoire: 1536m
# Jeton GitHub facultatif (à grain fin, sans accès à aucun dépôt : lecture publique seulement) : 5 000 requêtes
# par heure au lieu de 60. Sans lui, les réponses sont mises en cache et redemandées de façon conditionnelle.
supervision_veille_jeton_github: ""
# Image (sans étiquette) → projet : { nom, github (propriétaire/dépôt), avis (dépôt des avis, si différent ; "" =
#   aucun), paquet_avis (motif du paquet dans les avis), version_image / version_depot (motifs), etiquettes (le
#   projet ne publie pas de « releases »), expose (publié sur Internet), url_version (version lue sur le service,
#   voir supervision_veille_services), image_locale (construite sur place : pas d'analyse) }. Les images sans
#   projet (bases : nginx, postgres…) sont seulement analysées.
supervision_veille_sources:
  authelia/authelia: { nom: Authelia, github: authelia/authelia, expose: true }
  lldap/lldap: { nom: LLDAP, github: lldap/lldap }
  bunkerity/bunkerweb-all-in-one: { nom: BunkerWeb, github: bunkerity/bunkerweb, expose: true }
  nextcloud: { nom: Nextcloud, github: nextcloud/server, avis: nextcloud/security-advisories, paquet_avis: "^Server$", expose: true }
  ghcr.io/immich-app/immich-server: { nom: Immich, github: immich-app/immich, expose: true }
  # Même projet qu'Immich : avis déjà signalés sur le serveur.
  ghcr.io/immich-app/immich-machine-learning: { nom: Immich (apprentissage), github: immich-app/immich, avis: "" }
  traefik: { nom: Traefik, github: traefik/traefik }
  netboxcommunity/netbox: { nom: NetBox, github: netbox-community/netbox }
  homelab/semaphore: { nom: Semaphore, github: semaphoreui/semaphore, image_locale: true }
  grafana/grafana: { nom: Grafana, github: grafana/grafana }
  prom/prometheus: { nom: Prometheus, github: prometheus/prometheus }
  prom/alertmanager: { nom: Alertmanager, github: prometheus/alertmanager }
  prom/blackbox-exporter: { nom: Sondes (blackbox), github: prometheus/blackbox_exporter }
  prompve/prometheus-pve-exporter: { nom: Exporteur Proxmox, github: prometheus-pve/prometheus-pve-exporter }
  binwiederhier/ntfy: { nom: ntfy, github: binwiederhier/ntfy, expose: true }
  victoriametrics/victoria-logs: { nom: VictoriaLogs, github: VictoriaMetrics/VictoriaLogs }
  cloudflare/cloudflared: { nom: cloudflared, github: cloudflare/cloudflared, expose: true }
supervision_veille_sources_supplementaires: {}
# Services dont la version se lit sur le service lui-même : [{ nom, machine, url_version, champ, github, avis,
#   paquet_avis, expose }] (ex. coffre OpenBao : /v1/sys/health, champ « version »).
supervision_veille_services: []
# OPNsense : version installée relevée par l'hyperviseur (agent_supervision_opnsense), comparée aux étiquettes
# publiées : { machine, github, etiquettes: true, version_depot }. Vide = non suivi.
supervision_veille_opnsense: {}

# --- Détection d'intrusion sur les journaux (ADR 0021, étape 2) -------------------------------------------------
# vmalert interroge VictoriaLogs chaque minute ; gravité « securite » : e-mail + notification prioritaire, jamais
# sur le NOC. Chaque règle : { nom, requete (LogsQL, sans filtre de temps), par (champ de regroupement, ex.
# _HOSTNAME), fenetre, seuil (nombre d'événements), severite, resume, description }.
supervision_detection: true
# Sources SSH attendues (expressions régulières d'adresses : VPN d'administration, orchestrateur…). Toute autre
# connexion SSH acceptée déclenche une alerte.
supervision_ssh_sources_attendues: ['127\.0\.0\.1']
supervision_detection_regles:
  - nom: ConnexionSSHInattendue
    requete: >-
      SYSLOG_IDENTIFIER:sshd-session "Accepted"
      NOT _msg:~`from ({{ supervision_ssh_sources_attendues | join('|') }}) port`
    par: _HOSTNAME
    fenetre: 5m
    seuil: 1
    resume: "Connexion SSH depuis une source inattendue"
    description: "Clé acceptée depuis une adresse hors du VPN d'administration et de l'orchestrateur"
  - nom: EchecsSSH
    requete: >-
      SYSLOG_IDENTIFIER:sshd-session
      _msg:~"Invalid user|Failed (password|publickey)|authentication failure|Disconnected from invalid user"
    par: _HOSTNAME
    fenetre: 10m
    seuil: 5
    resume: "Échecs de connexion SSH répétés"
    description: "Tentatives de connexion SSH refusées"
  - nom: EchecsSudo
    requete: >-
      SYSLOG_IDENTIFIER:sudo _msg:~"authentication failure|incorrect password|NOT in sudoers|command not allowed"
    par: _HOSTNAME
    fenetre: 10m
    seuil: 1
    resume: "Élévation de privilèges refusée (sudo)"
    description: "sudo a refusé une commande ou un mot de passe"
  - nom: EchecsPortail
    requete: >-
      CONTAINER_NAME:identite-authelia-1 _msg:~"(?i)unsuccessful .*authentication attempt|banned"
    par: ""
    fenetre: 10m
    seuil: 10
    resume: "Échecs de connexion répétés sur le portail SSO"
    description: "Mots de passe ou seconds facteurs refusés par Authelia (attaque par dictionnaire ?)"
  - nom: FichiersSensiblesModifies
    requete: >-
      SYSLOG_IDENTIFIER:~"audisp|audit" _msg:~"key=\"(comptes|sudo|cles_ssh|ssh)\""
    par: _HOSTNAME
    fenetre: 5m
    seuil: 1
    resume: "Comptes, sudo ou clés SSH modifiés"
    description: "auditd a vu une écriture sur les comptes, sudoers, la configuration SSH ou des clés autorisées (normal pendant un déploiement Ansible)"
supervision_detection_regles_supplementaires: []
# Règles d'alerte (groupes Prometheus, YAML) et tableaux Grafana (JSON) venus d'ailleurs, ex. d'un dépôt privé :
# chemins de fichiers sur le poste de contrôle, copiés tels quels (sans interprétation par Ansible, les gabarits
# « {{ $labels… }} » des règles restent intacts). Gravité « admin » : e-mail + téléphone, jamais sur le NOC.
supervision_regles_supplementaires: []
supervision_tableaux_supplementaires: []

# Veille des connexions (08/10/2026) : une adresse devient « connue » à sa première connexion complète réussie (mot de
# passe et second facteur) et le reste ; des échecs depuis une adresse inconnue sans succès dans le délai déclenchent
# une alerte (« admin », ou « securite » si le mot de passe a été accepté). Un résumé des nouvelles adresses connues
# part chaque jour à l'heure dite (gravité « info »). Requêtes de connexion lues dans les journaux du WAF.
supervision_connexions: "{{ supervision_journaux | bool }}"
supervision_connexions_delai_minutes: 15
supervision_connexions_resume_heure: 8
supervision_connexions_amorcage_jours: 30
supervision_connexions_conteneur_waf: waf-bunkerweb-1
# Adresses ou réseaux toujours connus, en plus des adresses privées (ex. sortie d'un VPN de confiance).
supervision_connexions_adresses_connues: []
# Règles : requête vue par le WAF → type d'événement (succes = connexion complète, mot_de_passe = premier facteur
# accepté, echec, echec_second_facteur). Portail Authelia par défaut ; ajouter les applications à connexion propre
# dans supervision_connexions_regles_supplementaires.
supervision_connexions_regles:
  - { service: portail, hote: "auth.{{ domaine_public }}", methode: POST, chemin: /api/firstfactor, statuts: [200], type: mot_de_passe,
      cible_depuis_referent: true }
  - { service: portail, hote: "auth.{{ domaine_public }}", methode: POST, chemin: /api/firstfactor, statuts: [401, 403], type: echec,
      cible_depuis_referent: true }
  - { service: portail, hote: "auth.{{ domaine_public }}", methode: POST, chemin: /api/secondfactor/totp, statuts: [200], type: succes,
      cible_depuis_referent: true }
  - { service: portail, hote: "auth.{{ domaine_public }}", methode: POST, chemin: /api/secondfactor/totp, statuts: [401, 403],
      type: echec_second_facteur, cible_depuis_referent: true }
  - { service: portail, hote: "auth.{{ domaine_public }}", methode: POST, chemin: /api/secondfactor/webauthn, statuts: [200], type: succes,
      cible_depuis_referent: true }
  - { service: portail, hote: "auth.{{ domaine_public }}", methode: POST, chemin: /api/secondfactor/webauthn, statuts: [401, 403],
      type: echec_second_facteur, cible_depuis_referent: true }
supervision_connexions_regles_supplementaires: []
# Comptes visés par les échecs, lus dans les journaux des applications (groupe « compte », et « ip » si présente).
supervision_connexions_comptes:
  - conteneur: identite-authelia-1
    mot_cle: Unsuccessful
    motif: "Unsuccessful .* authentication attempt by user '(?P<compte>[^']+)'.*remote_ip=(?P<ip>[0-9a-fA-F.:]+)"
supervision_connexions_comptes_supplementaires: []
