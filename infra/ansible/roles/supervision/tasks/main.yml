- name: Créer les dossiers de la supervision
  ansible.builtin.file:
    path: "{{ supervision_dossier }}/{{ item.chemin }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { chemin: "", mode: "0750" }
    - { chemin: secrets, mode: "0700" }
    - { chemin: prometheus, mode: "0755" }
    - { chemin: alertmanager, mode: "0755" }
    - { chemin: alertmanager/secrets, mode: "0755" }
    - { chemin: grafana/provisioning/datasources, mode: "0755" }
    - { chemin: grafana/provisioning/dashboards, mode: "0755" }
    - { chemin: grafana/tableaux, mode: "0755" }
    - { chemin: noc, mode: "0755" }
    - { chemin: noc/site, mode: "0755" }
    - { chemin: sms, mode: "0755" }
    - { chemin: ntfy-relais, mode: "0755" }
    - { chemin: journaux, mode: "0755" }
    - { chemin: detection, mode: "0755" }
  loop_control:
    label: "{{ item.chemin or supervision_dossier }}"

# Seul dossier accessible en écriture au collecteur (utilisateur « nobody »), en lecture à la page.
- name: Créer le dossier de l'instantané du NOC
  ansible.builtin.file:
    path: "{{ supervision_dossier }}/noc/etat"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0755"

# Secrets lisibles dans leur conteneur (0444), mais inaccessibles sur l'hôte : dossier parent réservé à root.
- name: Écrire les secrets
  ansible.builtin.copy:
    dest: "{{ supervision_dossier }}/{{ item.chemin }}"
    content: "{{ item.valeur }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - { chemin: secrets/grafana_admin, valeur: "{{ supervision.grafana_admin_password }}" }
    - { chemin: secrets/grafana_oidc, valeur: "{{ oidc_clients.grafana.secret }}" }
    - { chemin: alertmanager/secrets/smtp, valeur: "{{ authelia.smtp_password }}" }
    - { chemin: alertmanager/secrets/ntfy, valeur: "{{ supervision.ntfy_alertmanager_password }}" }
    - { chemin: secrets/sms_utilisateur, valeur: "{{ supervision_sms_free.utilisateur | default('') }}", si: "{{ supervision_sms_free.cle is defined }}" }
    - { chemin: secrets/sms_cle, valeur: "{{ supervision_sms_free.cle | default('') }}", si: "{{ supervision_sms_free.cle is defined }}" }
  when: item.si | default(true) | bool
  loop_control:
    label: "{{ item.chemin }}"
  no_log: true
  notify: Redémarrer la supervision

- name: Écrire la configuration de l'exporteur Proxmox (jeton en lecture seule)
  ansible.builtin.template:
    src: pve.yml.j2
    dest: "{{ supervision_dossier }}/secrets/pve.yml"
    owner: root
    group: root
    mode: "0444"
  no_log: true
  notify: Redémarrer la supervision

# Lue sur l'hyperviseur lui-même : le rôle ne dépend d'aucun fichier du poste qui lance Ansible.
- name: Lire l'autorité de certification de Proxmox
  ansible.builtin.slurp:
    src: /etc/pve/pve-root-ca.pem
  delegate_to: "{{ item }}"
  become: false
  loop: "{{ groups['hyperviseurs'] }}"
  register: supervision_ca_pve

- name: Déposer l'autorité de certification de Proxmox (vérification TLS de l'API)
  ansible.builtin.copy:
    content: "{{ supervision_ca_pve.results | map(attribute='content') | map('b64decode') | join('') }}"
    dest: "{{ supervision_dossier }}/ca-bundle.pem"
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer la supervision

- name: Lire les autorités de certification du système
  ansible.builtin.slurp:
    src: /etc/ssl/certs/ca-certificates.crt
  register: supervision_autorites_systeme

- name: Déposer les autorités des sondes (système + autorité interne)
  ansible.builtin.copy:
    content: "{{ supervision_autorites_systeme.content | b64decode }}{{ supervision_ca_interne }}"
    dest: "{{ supervision_dossier }}/autorites.pem"
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer la supervision

# --- Veille des connexions : adresses connues, tentatives depuis une adresse inconnue --------------------
- name: Veille des connexions
  when: supervision_connexions | bool
  block:
    - name: Créer les dossiers de la veille des connexions
      ansible.builtin.file:
        path: "{{ supervision_dossier }}/{{ item.chemin }}"
        state: directory
        owner: "{{ item.proprietaire | default('root') }}"
        group: "{{ item.proprietaire | default('root') }}"
        mode: "{{ item.mode }}"
      loop:
        - { chemin: connexions, mode: "0755" }
        # Adresses connues et suspectes : seul dossier modifiable par le conteneur.
        - { chemin: connexions/etat, mode: "0750", proprietaire: "65534" }
      loop_control:
        label: "{{ item.chemin }}"

    - name: Déposer le script et la configuration de la veille des connexions
      ansible.builtin.copy:
        dest: "{{ supervision_dossier }}/connexions/{{ item.dest }}"
        content: "{{ item.contenu }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { dest: veille-connexions.py, contenu: "{{ lookup('ansible.builtin.file', 'connexions/veille-connexions.py') }}\n" }
        - dest: connexions.json
          contenu: >-
            {{ {'conteneur_waf': supervision_connexions_conteneur_waf,
                'delai_minutes': supervision_connexions_delai_minutes,
                'resume_heure': supervision_connexions_resume_heure,
                'amorcage_jours': supervision_connexions_amorcage_jours,
                'adresses_connues': supervision_connexions_adresses_connues,
                'regles': supervision_connexions_regles + supervision_connexions_regles_supplementaires,
                'comptes': supervision_connexions_comptes + supervision_connexions_comptes_supplementaires}
               | to_nice_json }}
      loop_control:
        label: "{{ item.dest }}"
      notify: Redémarrer la supervision

# --- Veille de sécurité : image locale (Trivy figé + script), configuration -------------------------------
- name: Veille de sécurité
  when: supervision_veille | bool
  block:
    - name: Créer les dossiers de la veille
      ansible.builtin.file:
        path: "{{ supervision_dossier }}/{{ item.chemin }}"
        state: directory
        owner: "{{ item.proprietaire | default('root') }}"
        group: "{{ item.proprietaire | default('root') }}"
        mode: "{{ item.mode }}"
      loop:
        - { chemin: veille, mode: "0755" }
        - { chemin: veille/image, mode: "0755" }
        # Cache de Trivy, listes de paquets des images, rapport : seul dossier modifiable par le conteneur.
        - { chemin: veille/donnees, mode: "0750", proprietaire: "65534" }
      loop_control:
        label: "{{ item.chemin }}"

    - name: Déposer les sources de l'image de la veille
      ansible.builtin.copy:
        dest: "{{ supervision_dossier }}/veille/image/{{ item.dest }}"
        content: "{{ item.contenu }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - { dest: Dockerfile, contenu: "{{ lookup('ansible.builtin.template', 'veille/Dockerfile.j2') }}" }
        - { dest: veille.py, contenu: "{{ lookup('ansible.builtin.file', 'veille/veille.py') }}\n" }
      loop_control:
        label: "{{ item.dest }}"

    # L'étiquette contient l'empreinte des sources : toute modification produit une nouvelle image.
    - name: Nommer l'image de la veille d'après ses sources
      ansible.builtin.set_fact:
        supervision_veille_image: >-
          homelab/veille:{{ (lookup('ansible.builtin.template', 'veille/Dockerfile.j2')
          ~ lookup('ansible.builtin.file', 'veille/veille.py')) | hash('sha256') | truncate(12, true, '') }}

    - name: Construire l'image de la veille
      community.docker.docker_image_build:
        name: "{{ supervision_veille_image.split(':')[0] }}"
        tag: "{{ supervision_veille_image.split(':')[1] }}"
        path: "{{ supervision_dossier }}/veille/image"
        rebuild: never

    - name: Déposer la configuration de la veille
      ansible.builtin.copy:
        dest: "{{ supervision_dossier }}/veille/veille.json"
        content: >-
          {{ {'prometheus': 'http://prometheus:9090',
              'sources': supervision_veille_sources | combine(supervision_veille_sources_supplementaires),
              'services': supervision_veille_services,
              'opnsense': supervision_veille_opnsense} | to_nice_json }}
        owner: root
        group: root
        mode: "0644"

    - name: Déposer le jeton GitHub de la veille (lecture publique seulement)
      ansible.builtin.copy:
        dest: "{{ supervision_dossier }}/secrets/github_veille"
        content: "{{ supervision_veille_jeton_github }}"
        owner: root
        group: root
        mode: "0444"
      when: supervision_veille_jeton_github | length > 0
      no_log: true

- name: Déposer les configurations
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ supervision_dossier }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: prometheus.yml.j2, dest: prometheus/prometheus.yml }
    - { src: alertmanager.yml.j2, dest: alertmanager/alertmanager.yml }
    - { src: ntfy.yml.j2, dest: ntfy.yml }
    - { src: grafana/sources.yml.j2, dest: grafana/provisioning/datasources/sources.yml }
    - { src: grafana/tableaux.yml.j2, dest: grafana/provisioning/dashboards/tableaux.yml }
    - { src: journaux-entree.conf.j2, dest: journaux/entree.conf }
    - { src: compose.yaml.j2, dest: compose.yaml }
    - { src: blackbox.yml.j2, dest: blackbox.yml }
    - { src: detection.yml.j2, dest: detection/detection.yml }
  loop_control:
    label: "{{ item.dest }}"
  notify: Redémarrer la supervision

- name: Déposer les règles d'alerte et le tableau de bord du NOC
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ supervision_dossier }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: alertes.yml, dest: prometheus/alertes.yml }
    - { src: noc.json, dest: grafana/tableaux/noc.json }
    - { src: veille.json, dest: grafana/tableaux/veille.json }
    - { src: transferts.json, dest: grafana/tableaux/transferts.json }
    - { src: stockage.json, dest: grafana/tableaux/stockage.json }
    - { src: journaux.json, dest: grafana/tableaux/journaux.json }
    - { src: connexions.json, dest: grafana/tableaux/connexions.json }
  loop_control:
    label: "{{ item.dest }}"
  notify: Redémarrer la supervision

- name: Déposer les règles d'alerte supplémentaires
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ supervision_dossier }}/prometheus/regles-{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ supervision_regles_supplementaires }}"
  notify: Redémarrer la supervision

- name: Déposer les tableaux Grafana supplémentaires
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ supervision_dossier }}/grafana/tableaux/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ supervision_tableaux_supplementaires }}"
  notify: Redémarrer la supervision

- name: Déposer le relais des notifications sur téléphone (ntfy)
  ansible.builtin.copy:
    src: ntfy/relais.py
    dest: "{{ supervision_dossier }}/ntfy-relais/relais.py"
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer la supervision

- name: Déposer le relais SMS des alertes critiques (Free Mobile)
  ansible.builtin.copy:
    src: sms/relais.py
    dest: "{{ supervision_dossier }}/sms/relais.py"
    owner: root
    group: root
    mode: "0644"
  when: supervision_sms_free.cle is defined
  notify: Redémarrer la supervision

- name: Déposer la page du NOC (fichiers statiques, sans redémarrage)
  ansible.builtin.copy:
    src: noc/site/
    dest: "{{ supervision_dossier }}/noc/site/"
    owner: root
    group: root
    mode: "u=rwX,go=rX"

- name: Déposer le collecteur, ses libellés et la configuration de la page du NOC
  ansible.builtin.copy:
    dest: "{{ supervision_dossier }}/noc/{{ item.dest }}"
    src: "{{ item.src | default(omit) }}"
    content: "{{ item.contenu | default(omit) }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: noc/collecte.py, dest: collecte.py }
    - { contenu: "{{ supervision_noc_libelles | to_nice_json }}\n", dest: noc.json }
    - { contenu: "{{ lookup('ansible.builtin.template', 'noc-nginx.conf.j2') }}", dest: nginx.conf }
  loop_control:
    label: "noc/{{ item.dest }}"
  notify: Redémarrer la supervision

- name: Démarrer la supervision
  community.docker.docker_compose_v2:
    project_src: "{{ supervision_dossier }}"
    state: present
    pull: missing
    remove_orphans: true

# --- ntfy : comptes et droits (tout est refusé par défaut) -----------------------------------------

- name: Lister les comptes ntfy
  ansible.builtin.command:
    cmd: docker compose exec -T ntfy ntfy user list
    chdir: "{{ supervision_dossier }}"
  register: supervision_ntfy_comptes
  changed_when: false

- name: Créer les comptes ntfy (Alertmanager en écriture, téléphone de Maxime en lecture)
  ansible.builtin.command:
    argv: [docker, compose, exec, -T, -e, "NTFY_PASSWORD={{ item.mdp }}", ntfy, ntfy, user, add, --role=user, "{{ item.nom }}"]
    chdir: "{{ supervision_dossier }}"
  loop:
    - { nom: alertmanager, mdp: "{{ supervision.ntfy_alertmanager_password }}" }
    - { nom: maxime, mdp: "{{ supervision.ntfy_maxime_password }}" }
  loop_control:
    label: "{{ item.nom }}"
  when: ("user " ~ item.nom ~ " ") not in supervision_ntfy_comptes.stdout
  changed_when: true
  no_log: true

- name: Donner les droits sur le sujet des alertes
  ansible.builtin.command:
    cmd: "docker compose exec -T ntfy ntfy access {{ item.nom }} {{ supervision_ntfy_sujet }} {{ item.droit }}"
    chdir: "{{ supervision_dossier }}"
  loop:
    - { nom: alertmanager, droit: write-only }
    - { nom: maxime, droit: read-only }
  loop_control:
    label: "{{ item.nom }} : {{ item.droit }}"
  when: (item.droit ~ " access to topic " ~ supervision_ntfy_sujet) not in supervision_ntfy_comptes.stdout
  changed_when: true
