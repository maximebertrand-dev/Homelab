# Configuration de l'hyperviseur Proxmox (audit du 26/09/2026, runbook de durcissement).

- name: Désactiver les dépôts réservés aux abonnés (erreur 401 sans abonnement)
  ansible.builtin.lineinfile:
    path: "/etc/apt/sources.list.d/{{ item }}.sources"
    line: "Enabled: no"
    insertbefore: BOF
  loop: [pve-enterprise, ceph]

- name: Déclarer le dépôt Proxmox gratuit
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/proxmox.sources
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ ansible_distribution_release }}
      Components: pve-no-subscription
      Signed-By: /usr/share/keyrings/proxmox-archive-keyring.gpg
    mode: "0644"

- name: Installer sanoid (instantanés ZFS automatiques)
  ansible.builtin.apt:
    name: sanoid
    state: present

- name: Créer le dataset parent des données (rien d'exécutable depuis les données)
  community.general.zfs:
    name: "{{ hyperviseur_racine_donnees }}"
    state: present
    extra_zfs_properties:
      mountpoint: "/{{ hyperviseur_racine_donnees }}"
      atime: "off"
      xattr: sa
      exec: "off"
      setuid: "off"
      devices: "off"

- name: Créer les datasets de données
  community.general.zfs:
    name: "{{ hyperviseur_racine_donnees }}/{{ item.key }}"
    state: present
    extra_zfs_properties:
      recordsize: "{{ item.value }}"
  loop: "{{ hyperviseur_datasets | dict2items }}"

- name: Appliquer les quotas des datasets de données
  community.general.zfs:
    name: "{{ hyperviseur_racine_donnees }}/{{ item.key }}"
    state: present
    extra_zfs_properties:
      quota: "{{ item.value }}"
  loop: "{{ hyperviseur_quotas | dict2items }}"

- name: Créer les dossiers du partage « medias »
  ansible.builtin.file:
    path: "/{{ hyperviseur_racine_donnees }}/medias/{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ hyperviseur_dossiers_medias }}"

# Dépôt de fichiers depuis un poste : clé dédiée, rsync enfermé dans le premier dossier du partage (rrsync), écriture
# seule, sans suppression ni remplacement, liens symboliques neutralisés, et seulement depuis l'adresse VPN du poste.
- name: Autoriser le dépôt de fichiers depuis les postes (rsync restreint)
  ansible.posix.authorized_key:
    user: root
    key: "{{ item.cle }}"
    key_options: >-
      from="{{ item.depuis }}",restrict,command="/usr/bin/rrsync -wo -no-del -no-overwrite -munge
      /{{ hyperviseur_racine_donnees }}/medias/{{ hyperviseur_dossiers_medias[0] }}"
  loop: "{{ hyperviseur_depot_medias }}"
  loop_control:
    label: "{{ item.cle.split()[-1] }}"

- name: Régler le cache ZFS (ARC)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/zfs.conf
    content: |
      # Géré par Ansible (rôle hyperviseur)
      options zfs zfs_arc_max={{ hyperviseur_zfs_arc_max }}
      {%- if hyperviseur_zfs_arc_min | string | length > 0 %} zfs_arc_min={{ hyperviseur_zfs_arc_min }}{% endif %}
    owner: root
    group: root
    mode: "0644"
  when: hyperviseur_zfs_arc_max | string | length > 0
  register: hyperviseur_arc

# Le plafond d'abord : un plancher au-dessus de l'ancien plafond serait refusé. Ces deux tâches s'exécutent tout de
# suite, pas en gestionnaires : un gestionnaire sauté (échec plus loin) ne serait jamais rejoué.
- name: Appliquer le réglage du cache ZFS sans redémarrage  # noqa: no-handler
  ansible.builtin.shell: |
    echo {{ hyperviseur_zfs_arc_max }} > /sys/module/zfs/parameters/zfs_arc_max
    {% if hyperviseur_zfs_arc_min | string | length > 0 %}
    echo {{ hyperviseur_zfs_arc_min }} > /sys/module/zfs/parameters/zfs_arc_min
    {% endif %}
  when: hyperviseur_arc is changed
  changed_when: true

- name: Régénérer l'initramfs (le module ZFS y lit ses options au démarrage)  # noqa: no-handler
  ansible.builtin.command: update-initramfs -u -k all
  when: hyperviseur_arc is changed
  changed_when: true

# Cache d'écriture des disques : désactivé en usine sur ces disques SAS, chaque écriture attendait la rotation du
# plateau (disques occupés 2 fois plus pour le même débit, 05/10). ZFS demande un vidage du cache à chaque
# transaction : sans risque, à condition que le noyau sache le cache actif (réglage par cache_type, pas par smartctl,
# sinon les vidages sont ignorés). Réappliqué à chaque démarrage et à chaque disque ajouté.
- name: Activer le cache d'écriture des disques (vidages transmis par le noyau)
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-disques-cache-ecriture.rules
    content: |
      # Géré par Ansible (rôle hyperviseur)
      ACTION=="add", SUBSYSTEM=="scsi_disk", ATTR{cache_type}="write back"
    owner: root
    group: root
    mode: "0644"
  when: hyperviseur_cache_ecriture | bool

- name: Configurer les instantanés des données
  ansible.builtin.copy:
    dest: /etc/sanoid/sanoid.conf
    content: |
      # Géré par Ansible (rôle hyperviseur) — voir la doc interne « Plateforme applicative »
      [{{ hyperviseur_racine_donnees }}]
      	use_template = donnees
      	recursive = yes
      {% for dataset in hyperviseur_sans_instantanes %}

      [{{ hyperviseur_racine_donnees }}/{{ dataset }}]
      	use_template = donnees
      	autosnap = no
      {% endfor %}

      [template_donnees]
      	frequently = 0
      	hourly = 48
      	daily = 30
      	monthly = 3
      	yearly = 0
      	autosnap = yes
      	autoprune = yes
    mode: "0644"

- name: Activer le minuteur de sanoid
  ansible.builtin.service:
    name: sanoid.timer
    state: started
    enabled: true

- name: Lister les correspondances de dossiers (virtiofs)
  ansible.builtin.command: pvesh get /cluster/mapping/dir --output-format json
  register: hyperviseur_correspondances
  changed_when: false
  check_mode: false

- name: Déclarer les correspondances de dossiers pour virtiofs
  ansible.builtin.command:
    argv: [pvesh, create, /cluster/mapping/dir, --id, "{{ item }}", --map, "node={{ inventory_hostname }},path=/{{ hyperviseur_racine_donnees }}/{{ item }}"]
  loop: "{{ hyperviseur_datasets.keys() | list }}"
  when: item not in (hyperviseur_correspondances.stdout | from_json | map(attribute='id') | list)
  changed_when: true

# --- Clé de descellement du coffre ------------------------------------------------------------------

- name: Créer le dataset de la clé du coffre (sans instantanés automatiques)
  community.general.zfs:
    name: "{{ hyperviseur_coffre.dataset }}"
    state: present
    extra_zfs_properties:
      "com.sun:auto-snapshot": "false"
  when: hyperviseur_coffre.dataset is defined

- name: Réserver le dossier de la clé à root
  ansible.builtin.file:
    path: "/{{ hyperviseur_coffre.dataset }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: hyperviseur_coffre.dataset is defined

- name: Générer la clé de descellement (32 octets aléatoires, une seule fois)
  ansible.builtin.command:
    cmd: "openssl rand -out /{{ hyperviseur_coffre.dataset }}/{{ hyperviseur_coffre.cle }}.key 32"
    creates: "/{{ hyperviseur_coffre.dataset }}/{{ hyperviseur_coffre.cle }}.key"
  when: hyperviseur_coffre.dataset is defined

- name: Protéger la clé de descellement
  ansible.builtin.file:
    path: "/{{ hyperviseur_coffre.dataset }}/{{ hyperviseur_coffre.cle }}.key"
    owner: root
    group: root
    mode: "0400"
  when: hyperviseur_coffre.dataset is defined

- name: Déclarer la correspondance virtiofs de la clé du coffre
  ansible.builtin.command:
    argv:
      - pvesh
      - create
      - /cluster/mapping/dir
      - --id
      - "{{ hyperviseur_coffre.correspondance }}"
      - --map
      - "node={{ inventory_hostname }},path=/{{ hyperviseur_coffre.dataset }}"
  when:
    - hyperviseur_coffre.dataset is defined
    - hyperviseur_coffre.correspondance not in (hyperviseur_correspondances.stdout | from_json | map(attribute='id') | list)
  changed_when: true

- name: Lire la configuration des stockages
  ansible.builtin.slurp:
    src: /etc/pve/storage.cfg
  register: hyperviseur_stockages

- name: Autoriser les extraits cloud-init sur le stockage local
  ansible.builtin.command: pvesm set local --content iso,vztmpl,backup,import,snippets
  when: "'snippets' not in (hyperviseur_stockages.content | b64decode)"
  changed_when: true

- name: Déposer l'extrait cloud-init commun aux VM
  ansible.builtin.copy:
    dest: /var/lib/vz/snippets/debian-base.yaml
    content: |
      #cloud-config
      # Géré par Ansible (rôle hyperviseur) : installe l'agent QEMU au premier démarrage.
      package_update: true
      packages:
        - qemu-guest-agent
      runcmd:
        - systemctl enable --now qemu-guest-agent
    mode: "0644"

# Ordre de démarrage des VM au boot de l'hôte : pare-feu d'abord (les autres ont besoin du réseau),
# puis identité, applications, WAF. Réglé ici car il exige un droit sur tout l'hôte (Sys.Modify).
- name: Lire la configuration des VM
  ansible.builtin.command: "qm config {{ item.key }}"
  loop: "{{ hyperviseur_demarrage | dict2items }}"
  register: hyperviseur_configs_vm
  changed_when: false
  failed_when: false   # VM pas encore créée : ignorée, réglée au passage suivant
  check_mode: false

- name: Régler l'ordre de démarrage des VM
  ansible.builtin.command: "qm set {{ item.item.key }} --startup {{ item.item.value }}"
  loop: "{{ hyperviseur_configs_vm.results }}"
  loop_control:
    label: "VM {{ item.item.key }} : {{ item.item.value }}"
  when:
    - item.rc == 0
    - "('startup: ' ~ item.item.value) not in item.stdout"
  changed_when: true

# iDRAC : l'IPMI sur le réseau (UDP 623) permet à tout appareil du réseau de la maison de récupérer l'empreinte
# du mot de passe d'un compte (faiblesse du protocole RAKP). L'interface web et la console virtuelle suffisent.
- name: Installer ipmitool (administration de l'iDRAC par l'interface interne du serveur)
  ansible.builtin.apt:
    name: ipmitool
    state: present

- name: Lire l'état de l'IPMI sur le réseau
  ansible.builtin.command: ipmitool channel info 1
  register: hyperviseur_ipmi
  changed_when: false
  check_mode: false

- name: Désactiver l'IPMI sur le réseau
  ansible.builtin.command: ipmitool lan set 1 access off
  when: "'Access Mode         : disabled' not in hyperviseur_ipmi.stdout"
  changed_when: true
