# Datasets de données partagés avec les VM (virtiofs) : nom => taille d'enregistrement ZFS en octets.
hyperviseur_datasets:
  photos: "1048576"   # 1 Mo : gros fichiers
  drive: "131072"    # 128 Ko : valeur par défaut
  medias: "1048576"   # 1 Mo : gros fichiers
hyperviseur_racine_donnees: rpool/donnees
# Datasets de données sans instantanés automatiques (gros volumes recopiables) : un fichier supprimé y libère sa
# place tout de suite au lieu de rester retenu par les instantanés (jusqu'à 3 mois). Les instantanés déjà pris
# expirent normalement.
hyperviseur_sans_instantanes: []
# Quotas ZFS par dataset de données (ex. { medias: 3.6T }) : un dataset plein ne prend pas la place des autres.
hyperviseur_quotas: {}
# Dossiers du dataset partagé « medias » (le premier reçoit aussi les dépôts depuis les postes).
hyperviseur_dossiers_medias: [bibliotheque]
# Dépôt de fichiers depuis un poste, par rsync restreint au premier dossier (ajout seul : ni lecture, ni
# suppression, ni remplacement). Une clé dédiée par poste :
#   - { cle: "ssh-ed25519 AAAA… depot-medias@poste", depuis: "adresse VPN du poste" }
hyperviseur_depot_medias: []
# Cache ZFS (ARC), en octets : plafond et plancher. Vide = réglages de l'installation de Proxmox (plafond à 10 % de
# la RAM, plancher à 1/32). Un plancher évite que le cache fonde sous la pression des VM (métadonnées relues sur disque).
hyperviseur_zfs_arc_max: ""
# Cache d'écriture des disques SAS activé au démarrage (règle udev) : ZFS vide le cache à chaque transaction.
hyperviseur_cache_ecriture: true
hyperviseur_zfs_arc_min: ""
# Ordre de démarrage : VMID => réglage Proxmox (order, up = secondes d'attente avant la suivante).
hyperviseur_demarrage: {}
# Clé de descellement automatique du coffre (OpenBao, « static seal ») : générée ici, jamais copiée sur une VM.
# Dataset à part (hors instantanés des données), partagé en lecture seule avec la VM du coffre par virtiofs :
# une sauvegarde du disque de la VM ne suffit donc pas à ouvrir le coffre.
#   hyperviseur_coffre: { dataset: rpool/coffre, correspondance: coffre-cle, cle: descellement-1 }
hyperviseur_coffre: {}
# Cartes PCI confiées en entier à une VM (passage PCI) : réservées à vfio-pci dès le démarrage de l'hôte (ses propres
# pilotes écartés), puis déclarées en correspondance Proxmox, seule forme qu'un jeton sans les droits de root peut
# attacher à une VM (OpenTofu).
#   hyperviseur_pci:
#     - id: gpu                          # nom de la correspondance, repris dans la description de la VM (OpenTofu)
#       chemin: "0000:01:00"             # sans numéro de fonction : toutes les fonctions de la carte (vidéo, son)
#       ids: ["10de:1c81", "10de:0fb9"]  # fabricant:modèle de chaque fonction, la principale d'abord
#       sous_systeme: "1458:372e"        # vérifié au démarrage de la VM : une autre carte au même endroit est refusée
#       groupe_iommu: 1
#       ecarter: [nouveau, nvidiafb]     # pilotes de l'hôte à ne jamais charger
hyperviseur_pci: []
# Compte d'OpenTofu autorisé à attacher ces correspondances (rôle Proxmox, utilisateur, jeton).
hyperviseur_pci_acces: { role: Provisionnement, utilisateur: tofu@pve, jeton: "tofu@pve!homelab" }
