- name: Créer les dossiers de Nextcloud
  ansible.builtin.file:
    path: "{{ item.chemin }}"
    state: directory
    owner: "{{ item.proprietaire | default('root') }}"
    group: "{{ item.proprietaire | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - { chemin: "{{ nextcloud_dossier }}", mode: "0750" }
    - { chemin: "{{ nextcloud_dossier }}/secrets", mode: "0700" }
    # www-data (33) dans l'image officielle ; les données sont sur le dataset ZFS partagé par virtiofs.
    - { chemin: "{{ nextcloud_donnees }}", mode: "0770", proprietaire: "33" }

# Écrits par Nextcloud (www-data, 33), lisibles par les autres services qui les montent en lecture seule.
- name: Créer les dossiers des stockages externes
  ansible.builtin.file:
    path: "{{ item.hote }}"
    state: directory
    owner: "33"
    group: "33"
    mode: "0755"
  loop: "{{ nextcloud_stockages_externes }}"
  loop_control:
    label: "{{ item.hote }}"

- name: Créer les sous-dossiers des stockages externes
  ansible.builtin.file:
    path: "{{ item.0.hote }}/{{ item.1 }}"
    state: directory
    owner: "33"
    group: "33"
    mode: "0755"
  loop: "{{ nextcloud_stockages_externes | subelements('sous_dossiers', skip_missing=true) }}"
  loop_control:
    label: "{{ item.0.hote }}/{{ item.1 }}"

- name: Écrire les secrets de Nextcloud
  ansible.builtin.copy:
    dest: "{{ nextcloud_dossier }}/secrets/{{ item.nom }}"
    content: "{{ item.valeur }}"
    owner: root
    group: root
    mode: "0444"
  loop:
    - { nom: postgres_password, valeur: "{{ nextcloud.db_password }}" }
    - { nom: admin_password, valeur: "{{ nextcloud.admin_password }}" }
    - { nom: redis_password, valeur: "{{ nextcloud.redis_password }}" }
  loop_control:
    label: "{{ item.nom }}"
  no_log: true

- name: Déposer le fichier Compose de Nextcloud
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ nextcloud_dossier }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

- name: Démarrer Nextcloud
  community.docker.docker_compose_v2:
    project_src: "{{ nextcloud_dossier }}"
    state: present
    pull: missing
    remove_orphans: true

- name: Attendre la fin de l'installation de Nextcloud
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ status --output=json
    chdir: "{{ nextcloud_dossier }}"
  register: nextcloud_statut
  until: nextcloud_statut.rc == 0 and (nextcloud_statut.stdout | from_json).installed | default(false)
  retries: 30
  delay: 10
  changed_when: false

# Vu de l'intérieur, auth.<domaine> pointe vers le WAF (adresse privée) : Nextcloud refuse par défaut toute
# connexion vers une adresse privée (protection contre les requêtes forgées, SSRF). Le pare-feu limite déjà ce que
# apps01 peut joindre en interne (WAF et LDAPS uniquement).
- name: Autoriser Nextcloud à joindre le portail d'authentification interne
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ config:system:set allow_local_remote_servers --value=true --type=boolean
    chdir: "{{ nextcloud_dossier }}"
  changed_when: false

- name: Désactiver les applications inutiles
  ansible.builtin.command:
    cmd: "docker compose exec -T -u www-data app php occ app:disable {{ item }}"
    chdir: "{{ nextcloud_dossier }}"
  loop: "{{ nextcloud_applis_desactivees }}"
  register: nextcloud_desactivation
  changed_when: "'disabled' in nextcloud_desactivation.stdout"
  failed_when: false

- name: Installer l'application OpenID Connect
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ app:install user_oidc
    chdir: "{{ nextcloud_dossier }}"
  register: nextcloud_oidc_appli
  changed_when: "'already installed' not in nextcloud_oidc_appli.stdout"
  failed_when: nextcloud_oidc_appli.rc != 0 and 'already installed' not in nextcloud_oidc_appli.stdout

- name: Lister les fournisseurs d'identité déclarés
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ user_oidc:provider --output=json
    chdir: "{{ nextcloud_dossier }}"
  register: nextcloud_fournisseurs
  changed_when: false

# Déclaré une seule fois ; pour changer un réglage ou le secret, relancer avec -e nextcloud_oidc_forcer=true.
- name: Déclarer Authelia comme fournisseur d'identité
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - -u
      - www-data
      - app
      - php
      - occ
      - user_oidc:provider
      - Authelia
      - --clientid=nextcloud
      - "--clientsecret={{ oidc_clients.nextcloud.secret }}"
      - "--discoveryuri={{ nextcloud_issuer }}/.well-known/openid-configuration"
      - "--scope={{ nextcloud_oidc_portees }}"
      - --unique-uid=0
      - --mapping-uid=preferred_username
      - --mapping-display-name=name
      - --mapping-email=email
      - "--mapping-groups={{ nextcloud_oidc_claim_groupes }}"
      - --group-provisioning=1
      - --check-bearer=0
      - --send-id-token-hint=1
    chdir: "{{ nextcloud_dossier }}"
  when: nextcloud_oidc_forcer | default(false) | bool or 'Authelia' not in nextcloud_fournisseurs.stdout
  no_log: true
  changed_when: true

- name: Activer PKCE pour la connexion OpenID Connect
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ config:app:set user_oidc use_pkce --value=1
    chdir: "{{ nextcloud_dossier }}"
  changed_when: false

- name: Préparer le compte de gestion des quotas (sous-administrateur de quelques groupes)
  when: nextcloud_compte_quotas.mot_de_passe is defined
  block:
    - name: Lister les groupes de Nextcloud
      ansible.builtin.command:
        cmd: docker compose exec -T -u www-data app php occ group:list --output=json
        chdir: "{{ nextcloud_dossier }}"
      register: nextcloud_groupes
      changed_when: false
      check_mode: false

    - name: Créer les groupes délégués au compte des quotas
      ansible.builtin.command:
        cmd: "docker compose exec -T -u www-data app php occ group:add {{ item }}"
        chdir: "{{ nextcloud_dossier }}"
      loop: "{{ nextcloud_compte_quotas.groupes | difference(nextcloud_groupes.stdout | from_json | list) }}"
      changed_when: true

    - name: Vérifier l'existence du compte des quotas
      ansible.builtin.command:
        cmd: "docker compose exec -T -u www-data app php occ user:info {{ nextcloud_compte_quotas.utilisateur }}"
        chdir: "{{ nextcloud_dossier }}"
      register: nextcloud_compte_quotas_info
      changed_when: false
      failed_when: false
      check_mode: false

    # Mot de passe transmis par variable d'environnement : jamais sur une ligne de commande.
    - name: Créer le compte des quotas
      ansible.builtin.command:
        cmd: >-
          docker compose exec -T -u www-data -e OC_PASS app php occ user:add --password-from-env
          --display-name "Gestion des quotas" {{ nextcloud_compte_quotas.utilisateur }}
        chdir: "{{ nextcloud_dossier }}"
      environment:
        OC_PASS: "{{ nextcloud_compte_quotas.mot_de_passe }}"
      when: nextcloud_compte_quotas_info.rc != 0
      changed_when: true
      no_log: true

    - name: Lire les groupes délégués au compte des quotas
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/ocs/v2.php/cloud/users/{{ nextcloud_compte_quotas.utilisateur }}/subadmins?format=json"
        headers: { OCS-APIRequest: "true", Host: "{{ nextcloud_domaine }}" }
        url_username: admin
        url_password: "{{ nextcloud.admin_password }}"
        force_basic_auth: true
      register: nextcloud_sous_admin
      check_mode: false
      when: not ansible_check_mode or nextcloud_compte_quotas_info.rc == 0
      no_log: true

    - name: Déléguer les groupes au compte des quotas
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/ocs/v2.php/cloud/users/{{ nextcloud_compte_quotas.utilisateur }}/subadmins?format=json"
        method: POST
        headers: { OCS-APIRequest: "true", Host: "{{ nextcloud_domaine }}" }
        url_username: admin
        url_password: "{{ nextcloud.admin_password }}"
        force_basic_auth: true
        body_format: form-urlencoded
        body: { groupid: "{{ item }}" }
      loop: "{{ nextcloud_compte_quotas.groupes | difference(nextcloud_sous_admin.json.ocs.data | default([])) }}"
      when: nextcloud_sous_admin is not skipped
      changed_when: true
      no_log: true

# Connexion par le seul SSO : la page de connexion renvoie directement vers le portail ; le formulaire local reste
# joignable par /login?direct=1 (compte administrateur de secours).
- name: Choisir la connexion par le SSO seul ou avec le formulaire local
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T -u www-data app php occ config:app:set
      --value={{ '0' if nextcloud_sso_seul | bool else '1' }} user_oidc allow_multiple_user_backends
    chdir: "{{ nextcloud_dossier }}"
  changed_when: false

- name: Quota par défaut des comptes
  ansible.builtin.command:
    cmd: >-
      docker compose exec -T -u www-data app php occ config:app:set files default_quota
      --value="{{ nextcloud_quota_defaut if nextcloud_quota_defaut | length > 0 else 'none' }}"
    chdir: "{{ nextcloud_dossier }}"
  changed_when: false

- name: Lancer les tâches de fond par cron (conteneur dédié)
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ background:cron
    chdir: "{{ nextcloud_dossier }}"
  changed_when: false

# --- Stockages externes (files_external) ------------------------------------------------------------

- name: Activer les stockages externes
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ app:enable files_external
    chdir: "{{ nextcloud_dossier }}"
  register: nextcloud_files_external
  changed_when: "'enabled' in nextcloud_files_external.stdout and 'already' not in nextcloud_files_external.stdout"
  when: nextcloud_stockages_externes | length > 0

# Sinon, un utilisateur pourrait monter un partage distant arbitraire (requêtes vers le réseau interne).
- name: Interdire aux utilisateurs d'ajouter leurs propres stockages externes
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ config:app:set files_external allow_user_mounting --value=no
    chdir: "{{ nextcloud_dossier }}"
  changed_when: false
  when: nextcloud_stockages_externes | length > 0

- name: Lister les stockages externes déclarés
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ files_external:list --output=json
    chdir: "{{ nextcloud_dossier }}"
  register: nextcloud_stockages_actuels
  changed_when: false
  when: nextcloud_stockages_externes | length > 0

- name: Déclarer les stockages externes (dossier local de l'hôte)
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - -u
      - www-data
      - app
      - php
      - occ
      - files_external:create
      - "{{ item.point }}"
      - local
      - null::null
      - "-c"
      - "datadir=/srv/stockages/{{ item.hote | basename }}"
    chdir: "{{ nextcloud_dossier }}"
  loop: "{{ nextcloud_stockages_externes }}"
  loop_control:
    label: "{{ item.point }}"
  when: item.point not in (nextcloud_stockages_actuels.stdout | from_json | map(attribute='mount_point') | list)
  changed_when: true

- name: Relire les stockages externes
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ files_external:list --output=json
    chdir: "{{ nextcloud_dossier }}"
  register: nextcloud_stockages_actuels
  changed_when: false
  when: nextcloud_stockages_externes | length > 0

# Utilisateurs autorisés, et prise en compte des fichiers ajoutés hors de Nextcloud (vérifiés à chaque accès).
- name: Régler l'accès et la détection des changements
  vars:
    montage: "{{ nextcloud_stockages_actuels.stdout | from_json | selectattr('mount_point', 'equalto', item.point) | first }}"
  ansible.builtin.shell:
    cmd: >-
      set -e;
      {% for u in item.utilisateurs | default([]) if u not in montage.applicable_users %}
      docker compose exec -T -u www-data app php occ files_external:applicable --add-user={{ u | quote }} {{ montage.mount_id }};
      {% endfor %}
      {% if (montage.configuration.filesystem_check_changes | default(montage.options.filesystem_check_changes | default(0))) | int != 1 %}
      docker compose exec -T -u www-data app php occ files_external:option {{ montage.mount_id }} filesystem_check_changes 1;
      {% endif %}
      echo fin
    chdir: "{{ nextcloud_dossier }}"
    executable: /bin/bash
  loop: "{{ nextcloud_stockages_externes }}"
  loop_control:
    label: "{{ item.point }}"
  register: nextcloud_reglages_stockages
  changed_when: nextcloud_reglages_stockages.stdout_lines | length > 1

# --- Habillage (application « Thème ») --------------------------------------------------------------------------
# Appliqué seulement quand la charte change : une empreinte des réglages et des fichiers est gardée dans la
# configuration de Nextcloud (theming/homelab_charte).
- name: Déposer les fichiers du thème
  ansible.builtin.copy:
    src: theme/
    dest: "{{ nextcloud_dossier }}/theme/"
    owner: root
    group: root
    mode: "0644"

- name: Calculer l'empreinte de la charte
  ansible.builtin.set_fact:
    nextcloud_theme_empreinte: >-
      {{ (nextcloud_theme | to_json
          ~ lookup('ansible.builtin.pipe', 'sha1sum ' ~ (role_path ~ '/files/theme/logo.svg') | quote)
          ~ lookup('ansible.builtin.pipe', 'sha1sum ' ~ (role_path ~ '/files/theme/fond.jpg') | quote)) | hash('sha1') }}

- name: Lire l'empreinte de la charte appliquée
  ansible.builtin.command:
    cmd: docker compose exec -T -u www-data app php occ config:app:get theming homelab_charte
    chdir: "{{ nextcloud_dossier }}"
  register: nextcloud_theme_actuel
  changed_when: false
  failed_when: false

- name: Appliquer le thème
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      occ() { docker compose exec -T -u www-data app php occ "$@"; }
      docker compose exec -T app mkdir -p /tmp/theme
      docker compose cp theme/logo.svg app:/tmp/theme/logo.svg
      docker compose cp theme/fond.jpg app:/tmp/theme/fond.jpg
      docker compose exec -T app chown -R www-data /tmp/theme
      occ theming:config name {{ nextcloud_theme.nom | quote }}
      occ theming:config slogan {{ nextcloud_theme.slogan | quote }}
      occ theming:config url {{ nextcloud_theme.url | quote }}
      occ theming:config imprintUrl {{ nextcloud_theme.mentions | quote }}
      occ theming:config privacyUrl {{ nextcloud_theme.confidentialite | quote }}
      occ theming:config primary_color {{ nextcloud_theme.couleur | quote }}
      occ theming:config background_color {{ nextcloud_theme.fond_couleur | quote }}
      occ theming:config logo /tmp/theme/logo.svg
      occ theming:config logoheader /tmp/theme/logo.svg
      occ theming:config favicon /tmp/theme/logo.svg
      occ theming:config background /tmp/theme/fond.jpg
      occ config:app:set theming homelab_charte --value={{ nextcloud_theme_empreinte }}
      docker compose exec -T app rm -rf /tmp/theme
    chdir: "{{ nextcloud_dossier }}"
    executable: /bin/bash
  when: nextcloud_theme_actuel.stdout | trim != nextcloud_theme_empreinte
  changed_when: true
