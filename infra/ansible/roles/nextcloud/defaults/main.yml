nextcloud_dossier: /opt/piles/nextcloud
nextcloud_image: nextcloud:35.0.1-apache
nextcloud_image_postgres: postgres:17.11-trixie
nextcloud_image_valkey: valkey/valkey:9.1.2-alpine
nextcloud_donnees: /srv/drive
nextcloud_domaine: "drive.{{ domaine_public }}"
nextcloud_issuer: "https://auth.{{ domaine_public }}"
# Portées demandées au SSO et claim d'où viennent les groupes Nextcloud (un claim dérivé peut traduire le groupe des
# administrateurs du SSO en groupe « admin » de Nextcloud). Changer ces valeurs : relancer avec nextcloud_oidc_forcer.
nextcloud_oidc_portees: "openid email profile groups"
nextcloud_oidc_claim_groupes: groups
# Connexion par le SSO seul (redirection directe vers le portail) ; formulaire local : /login?direct=1.
nextcloud_sso_seul: true
# Compte local dédié à la gestion des quotas (page des comptes) : sous-administrateur des groupes indiqués seulement
# (il ne peut toucher ni aux administrateurs ni aux autres groupes). { utilisateur, mot_de_passe, groupes: [...] }
nextcloud_compte_quotas: {}
# Quota par défaut des comptes (ex. « 300 GB » ; vide = illimité). Modifiable compte par compte (page des comptes).
nextcloud_quota_defaut: ""
# Stockages externes (application files_external) : dossiers de l'hôte présentés dans le drive, partagés avec
# d'autres services qui les lisent. Les utilisateurs ne peuvent pas ajouter leurs propres stockages externes.
#   - { point: /Partage, hote: /srv/partage, sous_dossiers: [Documents], utilisateurs: [alice] }
nextcloud_stockages_externes: []
# Applications désactivées : chaque application active élargit la surface d'attaque.
nextcloud_applis_desactivees: [dashboard, weather_status, firstrunwizard, recommendations, survey_client, support, app_api, photos]
# Habillage (application « Thème ») aux couleurs du homelab, comme le portail de connexion. Fichiers : files/theme.
nextcloud_theme:
  nom: Drive
  slogan: Les fichiers de la famille
  url: "https://accueil.{{ domaine_public }}"
  mentions: "https://{{ domaine_public }}/mentions-legales/"
  confidentialite: "https://{{ domaine_public }}/confidentialite/"
  couleur: "#0d9488"
  fond_couleur: "#070b14"
